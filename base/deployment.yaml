apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: msb-argo-test
  labels:
    app: msb-argo-test
spec:
  replicas: 3
  selector:
    matchLabels:
      app: msb-argo-test
  template:
    metadata:
      labels:
        app: msb-argo-test
    spec:
      containers:
        - name: msb-argo-test
          image: nginxinc/nginx-unprivileged:1.25
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: msb-argo-test-config
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  APP_MODE: "test"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: msb-argo-presync-check
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  template:
    spec:
      containers:
        - name: presync-check
          image: nginxinc/nginx-unprivileged:1.25
          command: ["sh", "-c", "echo 'PreSync check: validating environment...' && sleep 3 && echo 'PreSync OK'"]
      restartPolicy: Never
  backoffLimit: 1
---
apiVersion: batch/v1
kind: Job
metadata:
  name: msb-argo-postsync-notify
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  template:
    spec:
      containers:
        - name: postsync-notify
          image: nginxinc/nginx-unprivileged:1.25
          command: ["sh", "-c", "echo 'PostSync notify: deployment complete, would send webhook here'"]
      restartPolicy: Never
  backoffLimit: 1
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: msb-argo-test-config
data:
  note: "test config"
