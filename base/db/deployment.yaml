apiVersion: apps/v1
kind: Deployment
metadata:
  name: msb-db
  labels:
    app: msb-db
    tier: db
spec:
  replicas: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: msb-db
  template:
    metadata:
      labels:
        app: msb-db
    spec:
      containers:
        - name: msb-db
          image: registry.redhat.io/rhel9/postgresql-16
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: msb-db-credentials
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/pgsql/data
              subPath: pgdata
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: db-data
          emptyDir: {}
